name: collect

on:
  schedule:
    - cron: "*/30 * * * *" # 30분 간격 (스케줄 지연은 흔하다 — "30분 내"는 목표치)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "쓰기·LLM 없이 신규 판정까지만"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: check secrets
        id: secrets
        env:
          LH_API_KEY: ${{ secrets.LH_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$LH_API_KEY" ]; then
            echo "::notice::LH_API_KEY secret이 없어 이번 실행을 건너뜁니다 (Settings → Secrets and variables → Actions)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SUPABASE_URL" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::notice::SUPABASE_URL secret이 없어 dry-run으로만 실행합니다."
            echo "ready=dry" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: collect
        if: steps.secrets.outputs.ready != 'false'
        env:
          LH_API_KEY: ${{ secrets.LH_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL || 'claude-opus-5' }}
          MAX_ANNOUNCEMENTS_PER_RUN: ${{ vars.MAX_ANNOUNCEMENTS_PER_RUN || '10' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ] || [ "${{ steps.secrets.outputs.ready }}" = "dry" ]; then npm run collect:dry; else npm run collect; fi
